services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/credentials/earthquake-final-de.json
      PYTHONPATH: /opt/airflow/src
      DBT_PROFILES_DIR: /opt/airflow/dbt_project
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt_project:/opt/airflow/dbt_project
      - ./sql:/opt/airflow/sql:ro
      - ./credentials:/opt/airflow/credentials:ro
      - airflow_logs:/opt/airflow/logs
    command: ["webserver"]
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/credentials/earthquake-final-de.json
      PYTHONPATH: /opt/airflow/src
      DBT_PROFILES_DIR: /opt/airflow/dbt_project
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt_project:/opt/airflow/dbt_project
      - ./sql:/opt/airflow/sql:ro
      - ./credentials:/opt/airflow/credentials:ro
      - airflow_logs:/opt/airflow/logs
    command: ["scheduler"]
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/earthquake-final-de.json
    volumes:
      - ./app:/app/dashboard
      - ./credentials:/app/credentials:ro
    command: ["streamlit", "run", "dashboard/dashboard.py", "--server.address=0.0.0.0"]
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
